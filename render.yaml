services:
  - type: web
    name: vyaparpulse
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: "sqlite:///vyaparpulse.db"
      - key: LLM_API_KEY
        sync: false
